<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <!-- Transparent background, centered Git diamond logo with crisp white branch lines and nodes -->
  <g transform="translate(64, 64) rotate(45) translate(-64, -64)">
    <!-- Rotated rounded square (diamond) -->
    <rect x="19" y="19" width="90" height="90" rx="16" fill="#F05133"/>
    
    <!-- Main vertical trunk -->
    <line x1="49" y1="36" x2="49" y2="92" stroke="#FFFFFF" stroke-width="8.5" stroke-linecap="round"/>
    
    <!-- Curved branch to right node -->
    <path d="M 49 61 C 49 71, 65 71, 79 79" fill="none" stroke="#FFFFFF" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Top node -->
    <circle cx="49" cy="36" r="9" fill="#FFFFFF"/>
    
    <!-- Bottom node -->
    <circle cx="49" cy="92" r="9" fill="#FFFFFF"/>
    
    <!-- Right branch node -->
    <circle cx="79" cy="79" r="9" fill="#FFFFFF"/>
  </g>
</svg>
